# ---------------------------------------------------------------------------
# New Relic APM configuration for ERP Django
#
# The license key and app name are read from environment variables so that
# secrets stay outside version control.
#
# Docs: https://docs.newrelic.com/docs/apm/agents/python-agent/configuration/python-agent-configuration/
# ---------------------------------------------------------------------------

[newrelic]
# ── Required ────────────────────────────────────────────────────────────────
license_key = %(NEW_RELIC_LICENSE_KEY)s
app_name = %(NEW_RELIC_APP_NAME)s

# ── Agent behaviour ────────────────────────────────────────────────────────
monitor_mode = true
log_file = stderr
log_level = info

# ── Transaction tracing ────────────────────────────────────────────────────
transaction_tracer.enabled = true
transaction_tracer.transaction_threshold = apdex_f
transaction_tracer.record_sql = obfuscated
transaction_tracer.explain_enabled = true
transaction_tracer.explain_threshold = 0.5
transaction_tracer.stack_trace_threshold = 0.5

# ── Error collector ────────────────────────────────────────────────────────
error_collector.enabled = true
error_collector.ignore_classes =
error_collector.ignore_status_codes = 100-102 200-208 226 300-308 404

# ── Browser monitoring (Real User Monitoring) ──────────────────────────────
browser_monitoring.auto_instrument = true

# ── Thread profiling ───────────────────────────────────────────────────────
thread_profiler.enabled = true

# ── Distributed tracing ────────────────────────────────────────────────────
distributed_tracing.enabled = true
