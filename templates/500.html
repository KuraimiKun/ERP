{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error — Intara ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --clr-primary:       #6366f1;
            --clr-primary-hover: #4f46e5;
            --clr-gray-500:      #64748b;
            --clr-gray-800:      #1e293b;
            --clr-gray-900:      #0f172a;
            --clr-danger:        #ef4444;
            --clr-danger-light:  #fee2e2;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Tajawal', sans-serif;
            margin: 0;
            min-height: 100vh;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .error-card {
            text-align: center;
            max-width: 440px;
            width: 100%;
        }
        .error-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            margin-bottom: 2.5rem;
        }
        .error-logo-icon {
            width: 36px; height: 36px; border-radius: 8px;
            background: #fff;
            border: 1px solid #e2e8f0;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .error-logo-icon i { display: none; }
        .error-logo-icon::before {
            content: '';
            width: 24px;
            height: 24px;
            background: url("{% static 'logo.svg' %}") center/contain no-repeat;
        }
        .error-logo-text {
            font-size: 1.15rem; font-weight: 700; color: var(--clr-gray-900);
        }
        .error-icon {
            width: 80px; height: 80px; border-radius: 50%;
            background: var(--clr-danger-light);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.5rem;
        }
        .error-icon i { font-size: 2rem; color: var(--clr-danger); }
        .error-code {
            font-size: 3.5rem; font-weight: 800; color: var(--clr-gray-900);
            line-height: 1; margin-bottom: 0.5rem;
        }
        .error-title {
            font-size: 1.25rem; font-weight: 600; color: var(--clr-gray-800);
            margin-bottom: 0.5rem;
        }
        .error-message {
            font-size: 0.9rem; color: var(--clr-gray-500);
            margin-bottom: 2rem; line-height: 1.6;
        }
        .error-btn {
            display: inline-flex; align-items: center; gap: 0.5rem;
            padding: 0.65rem 1.5rem; border-radius: 8px;
            background: var(--clr-primary); color: #fff;
            text-decoration: none; font-weight: 600; font-size: 0.9rem;
            transition: background 0.2s;
        }
        .error-btn:hover { background: var(--clr-primary-hover); color: #fff; }
        .error-footer {
            margin-top: 3rem; font-size: 0.75rem; color: var(--clr-gray-500);
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-logo">
            <div class="error-logo-icon"><i class="bi bi-building-fill"></i></div>
            <span class="error-logo-text">Intara ERP</span>
        </div>
        <div class="error-icon"><i class="bi bi-exclamation-triangle"></i></div>
        <div class="error-code">500</div>
        <h1 class="error-title">Server Error</h1>
        <p class="error-message">
            Something went wrong on our end. Our team has been notified.
            Please try again later.
        </p>
        <a href="/" class="error-btn">
            <i class="bi bi-arrow-left"></i> Go to Home
        </a>
        <div class="error-footer">
            &copy; 2026 Intara ERP
        </div>
    </div>
</body>
</html>
