<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ERP System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --clr-primary:       #6366f1;
            --clr-primary-hover: #4f46e5;
            --clr-primary-light: #eef2ff;
            --clr-primary-ring:  rgba(99,102,241,0.25);
            --clr-violet:        #8b5cf6;
            --clr-gray-400:      #94a3b8;
            --clr-gray-500:      #64748b;
            --clr-gray-700:      #334155;
            --clr-gray-800:      #1e293b;
            --clr-gray-900:      #0f172a;
            --border-color:      #e2e8f0;
            --border-radius:     10px;
            --border-radius-sm:  6px;
            --border-radius-pill:9999px;
            --shadow-lg: 0 10px 15px rgba(15,23,42,0.06), 0 4px 6px rgba(15,23,42,0.04);
            --gradient-primary:  linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Tajawal', sans-serif;
            margin: 0;
            min-height: 100vh;
            background: #f1f5f9;
        }
        .auth-layout {
            display: flex;
            min-height: 100vh;
        }
        /* Left brand panel */
        .auth-brand-panel {
            display: none;
            flex: 1;
            background: var(--clr-gray-900);
            position: relative;
            overflow: hidden;
            padding: 3rem;
            flex-direction: column;
            justify-content: space-between;
        }
        @media (min-width: 992px) {
            .auth-brand-panel { display: flex; }
        }
        .auth-brand-panel::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(99,102,241,0.25) 0%, rgba(139,92,246,0.15) 100%);
        }
        /* Decorative grid dots */
        .auth-brand-panel::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
            background-size: 28px 28px;
        }
        .brand-panel-content {
            position: relative;
            z-index: 1;
        }
        .brand-panel-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 3rem;
        }
        .brand-panel-logo-icon {
            width: 44px;
            height: 44px;
            background: var(--gradient-primary);
            border-radius: var(--border-radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.3rem;
            box-shadow: 0 4px 14px rgba(99,102,241,0.4);
        }
        .brand-panel-logo-text {
            color: #fff;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }
        .brand-headline {
            color: #fff;
            font-size: 2rem;
            font-weight: 800;
            line-height: 1.25;
            letter-spacing: -0.02em;
            margin-bottom: 1rem;
        }
        .brand-subline {
            color: var(--clr-gray-400);
            font-size: 0.95rem;
            line-height: 1.6;
            max-width: 340px;
        }
        .brand-features {
            list-style: none;
            padding: 0;
            margin: 2rem 0 0;
        }
        .brand-features li {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            color: rgba(255,255,255,0.75);
            font-size: 0.875rem;
            margin-bottom: 0.65rem;
        }
        .brand-features li i {
            color: #10b981;
            font-size: 1rem;
        }
        .brand-panel-footer {
            position: relative;
            z-index: 1;
            color: var(--clr-gray-500);
            font-size: 0.78rem;
        }
        /* Right form panel */
        .auth-form-panel {
            flex: 0 0 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            background: #fff;
        }
        @media (min-width: 992px) {
            .auth-form-panel { flex: 0 0 460px; }
        }
        .auth-form-inner {
            width: 100%;
            max-width: 380px;
        }
        .auth-form-logo {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 2rem;
        }
        .auth-form-logo-icon {
            width: 36px;
            height: 36px;
            background: var(--gradient-primary);
            border-radius: var(--border-radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1rem;
        }
        .auth-form-logo-text {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--clr-gray-900);
        }
        .auth-heading {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--clr-gray-900);
            letter-spacing: -0.02em;
            margin-bottom: 0.4rem;
        }
        .auth-subheading {
            color: var(--clr-gray-500);
            font-size: 0.875rem;
            margin-bottom: 2rem;
        }
        .auth-form-inner .form-label {
            font-size: 0.855rem;
            font-weight: 500;
            color: var(--clr-gray-700);
            margin-bottom: 0.4rem;
        }
        .auth-form-inner .form-control {
            border-radius: var(--border-radius-sm);
            border-color: var(--border-color);
            font-size: 0.875rem;
            padding: 0.55rem 0.85rem;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .auth-form-inner .form-control:focus {
            border-color: var(--clr-primary);
            box-shadow: 0 0 0 3px var(--clr-primary-ring);
        }
        .btn-auth {
            width: 100%;
            padding: 0.65rem;
            background: var(--gradient-primary);
            border: none;
            border-radius: var(--border-radius-sm);
            color: #fff;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(99,102,241,0.35);
            transition: opacity 0.2s, transform 0.2s, box-shadow 0.2s;
        }
        .btn-auth:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(99,102,241,0.4); }
        .btn-auth:active { transform: translateY(0); }
        .auth-divider {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin: 1.25rem 0;
            color: var(--clr-gray-400);
            font-size: 0.78rem;
        }
        .auth-divider::before, .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }
        .auth-footer-link {
            text-align: center;
            font-size: 0.83rem;
            color: var(--clr-gray-500);
            margin-top: 1.5rem;
        }
        .auth-footer-link a {
            color: var(--clr-primary);
            text-decoration: none;
            font-weight: 600;
        }
        .auth-footer-link a:hover { color: var(--clr-primary-hover); text-decoration: underline; }
        .alert {
            border-radius: var(--border-radius-sm);
            font-size: 0.855rem;
            border: none;
            border-left: 4px solid;
        }
        .alert-danger { border-color: #ef4444; background: #fee2e2; color: #991b1b; }

        /* status-card (used by other tenant pages) */
        .status-card {
            max-width: 600px;
            margin: 100px auto;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% if messages %}
    <div style="position:fixed; top:1rem; right:1rem; z-index:9999; max-width:380px;">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show shadow-sm" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    {% block content %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
