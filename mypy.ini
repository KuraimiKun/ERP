[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = False
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
strict_optional = True
incremental = False
# django-stubs plugin disabled for CI compatibility
# Plugin causes "NewSemanalDjangoPlugin" errors with mypy >= 1.20
# Model field var-annotated errors suppressed in per-module config instead

# Per-module options for stricter checking on specific components

[mypy-erp.api.*]
disallow_untyped_defs = False

[mypy-erp.ai.models]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disable_error_code = var-annotated

[mypy-erp.models.*]
# Django models typically don't need field annotations
disallow_untyped_defs = False
disallow_incomplete_defs = False
disable_error_code = var-annotated

[mypy-tenants.models]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disable_error_code = var-annotated,assignment,misc

# Third-party libraries without stubs
[mypy-newrelic.*]
ignore_missing_imports = True

[mypy-dateutil.*]
ignore_missing_imports = True

[mypy-lime.*]
ignore_missing_imports = True

[mypy-shap.*]
ignore_missing_imports = True

[mypy-psutil.*]
ignore_missing_imports = True

[mypy-docker.*]
ignore_missing_imports = True

[mypy-dotenv.*]
ignore_missing_imports = True

[mypy-factory.*]
ignore_missing_imports = True

# Django admin allows dynamic attribute assignment on functions
[mypy-tenants.admin]
disable_error_code = attr-defined

# AI services use non-annotated ML libraries
[mypy-erp.ai.services.*]
disable_error_code = no-any-return

# Management commands have weak typing on data structures
[mypy-erp.management.commands.erp_first_setup]
disable_error_code = arg-type,call-overload,index,misc,attr-defined,no-any-return

[mypy-erp.management.commands.seed_ml_operational_data]
disable_error_code = unused-ignore,no-any-return

[mypy-erp.management.commands.seed_tenant]
disable_error_code = no-any-return,var-annotated

[mypy-erp.setup_defaults]
disable_error_code = arg-type

[mypy-erp.views.*]
disable_error_code = misc

[mypy-erp.api.views]
disable_error_code = misc

[mypy-erp.ai.services.assistant]
disable_error_code = union-attr

[mypy-erp.ai.services.base]
disable_error_code = call-overload,attr-defined

[mypy-erp.ai.services.explainability]
disable_error_code = index,assignment

[mypy-erp.management.commands.train_models]
disable_error_code = assignment,arg-type
