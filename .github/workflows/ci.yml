name: Django CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      force_bootstrap:
        description: 'Force a full server re-bootstrap (use after a server wipe)'
        type: boolean
        default: false
        required: false

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: erp_main
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_NAME: erp_main
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      REDIS_URL: redis://localhost:6379/1
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-not-for-production
      FIELD_ENCRYPTION_KEY: g4m3hYmX6K2sSWeVn19A-p3aZRbQ2K2B5vDqD2GfT2Q=
      ALLOWED_HOSTS: localhost

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libcairo2-dev pkg-config

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Lint with ruff
      run: |
        ruff check .

    - name: Type-check with mypy
      run: |
        mypy erp/ erpproject/ tenants/ --ignore-missing-imports

    - name: Check for missing migrations
      run: |
        python manage.py makemigrations --check --dry-run

    - name: Run Tests
      run: |
        python manage.py test --settings=erpproject.test_settings

  # ── Deploy ──────────────────────────────────────────────────────────────────
  # Runs on every push to main/master and on manual workflow_dispatch.
  #
  # AUTO-DETECTS which mode to use on every run:
  #
  #   BOOTSTRAP mode — runs automatically on the FIRST push to a fresh server
  #   (or when force_bootstrap=true). Generates .env.production from secrets,
  #   then runs deploy/deploy.sh which installs all packages, PostgreSQL, Redis,
  #   Nginx, SSL, Docker, systemd services, firewall, etc.
  #
  #   FAST DEPLOY mode — runs on every subsequent push. Rsyncs code, installs
  #   any new deps, migrates, collects static files, restarts services.
  #
  # Required secrets (Settings → Secrets → Actions):
  #
  #   Always required:
  #     VPS_HOST                  — EC2 Elastic IP or hostname
  #     VPS_USER                  — SSH user ('ubuntu' on AWS EC2)
  #     VPS_SSH_KEY               — private SSH key
  #
  #   Required for bootstrap (first push to a fresh server):
  #     PROD_DOMAIN               — your domain (e.g. erp.example.com)
  #     PROD_SECRET_KEY           — Django secret key
  #     PROD_DB_PASSWORD          — PostgreSQL password
  #     PROD_FIELD_ENCRYPTION_KEY — django-encrypted-fields key
  #     PROD_SSL_EMAIL            — Let's Encrypt notification email
  #     PROD_SUPERUSER_EMAIL      — Django admin login email
  #     PROD_SUPERUSER_PASSWORD   — Django admin login password
  #
  #   Optional:
  #     VPS_PORT                  — SSH port (default: 22)
  #     VPS_APP_DIR               — app directory (default: /opt/erpdjango)
  #     PROD_GUNICORN_WORKERS     — Gunicorn worker count (default: 3)
  #     PROD_CELERY_CONCURRENCY   — Celery concurrency (default: 4)
  #     PROD_EMAIL_HOST_USER      — SMTP username
  #     PROD_EMAIL_HOST_PASSWORD  — SMTP password
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      ((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
       github.event_name == 'push')

    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      APP_DIR:  ${{ secrets.VPS_APP_DIR || '/opt/erpdjango' }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up SSH agent
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

    - name: Add VPS to known hosts
      run: ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

    # Check if the server has already been bootstrapped (venv exists).
    # Sync code to the right place based on the result:
    #   - Bootstrap → staging dir the ubuntu user can write to
    #   - Fast deploy → APP_DIR directly via sudo rsync
    - name: Detect mode and sync code
      id: sync
      run: |
        FORCE="${{ github.event.inputs.force_bootstrap }}"

        if [ "$FORCE" = "true" ] || \
           ! ssh -o StrictHostKeyChecking=no -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
               "test -f '$APP_DIR/venv/bin/activate' && test -f /etc/systemd/system/erp-gunicorn.socket" 2>/dev/null; then
          echo "mode=bootstrap" >> "$GITHUB_OUTPUT"
          echo "==> Mode: BOOTSTRAP (server not yet set up)"
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='venv/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='.env' \
            --exclude='media/' \
            --exclude='staticfiles/' \
            --exclude='logs/' \
            -e "ssh -p $VPS_PORT" \
            ./ "$VPS_USER@$VPS_HOST:/home/$VPS_USER/erp-bootstrap/"
        else
          echo "mode=deploy" >> "$GITHUB_OUTPUT"
          echo "==> Mode: FAST DEPLOY"
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='venv/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='.env' \
            --exclude='media/' \
            --exclude='staticfiles/' \
            --exclude='logs/' \
            --rsync-path="sudo rsync" \
            -e "ssh -p $VPS_PORT" \
            ./ "$VPS_USER@$VPS_HOST:$APP_DIR/"
        fi

    # ── BOOTSTRAP ─────────────────────────────────────────────────────────────
    # Writes .env.production from secrets then runs deploy/deploy.sh as root.
    # Takes ~5-10 min on a fresh instance. Cleans up the staging dir when done.
    - name: Bootstrap — write .env.production and run deploy.sh
      if: steps.sync.outputs.mode == 'bootstrap'
      uses: appleboy/ssh-action@v1.0.3
      env:
        STAGING:          /home/${{ secrets.VPS_USER }}/erp-bootstrap
        PROD_DOMAIN:      ${{ secrets.PROD_DOMAIN }}
        PROD_SECRET_KEY:  ${{ secrets.PROD_SECRET_KEY }}
        PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
        PROD_ENC_KEY:     ${{ secrets.PROD_FIELD_ENCRYPTION_KEY }}
        PROD_SSL_EMAIL:   ${{ secrets.PROD_SSL_EMAIL }}
        PROD_SU_EMAIL:    ${{ secrets.PROD_SUPERUSER_EMAIL }}
        PROD_SU_PASS:     ${{ secrets.PROD_SUPERUSER_PASSWORD }}
        PROD_GW:          ${{ secrets.PROD_GUNICORN_WORKERS || '3' }}
        PROD_CC:          ${{ secrets.PROD_CELERY_CONCURRENCY || '4' }}
        PROD_EMAIL_USER:  ${{ secrets.PROD_EMAIL_HOST_USER || '' }}
        PROD_EMAIL_PASS:  ${{ secrets.PROD_EMAIL_HOST_PASSWORD || '' }}
      with:
        host:     ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key:      ${{ secrets.VPS_SSH_KEY }}
        port:     ${{ secrets.VPS_PORT || '22' }}
        envs: STAGING,PROD_DOMAIN,PROD_SECRET_KEY,PROD_DB_PASSWORD,PROD_ENC_KEY,PROD_SSL_EMAIL,PROD_SU_EMAIL,PROD_SU_PASS,PROD_GW,PROD_CC,PROD_EMAIL_USER,PROD_EMAIL_PASS
        command_timeout: 30m
        script: |
          set -euo pipefail

          # Write .env.production using printf %q which shell-quotes each value,
          # safely escaping any special characters (parens, $, !, quotes, etc.)
          # deploy.sh sources this file, so values must be valid bash assignments.
          {
            printf 'DOMAIN=%q\n'               "$PROD_DOMAIN"
            printf 'SECRET_KEY=%q\n'           "$PROD_SECRET_KEY"
            printf 'DB_NAME=erp_main\n'
            printf 'DB_USER=erp_user\n'
            printf 'DB_PASSWORD=%q\n'          "$PROD_DB_PASSWORD"
            printf 'FIELD_ENCRYPTION_KEY=%q\n' "$PROD_ENC_KEY"
            printf 'ENABLE_SSL=true\n'
            printf 'SSL_EMAIL=%q\n'            "$PROD_SSL_EMAIL"
            printf 'SUPERUSER_EMAIL=%q\n'      "$PROD_SU_EMAIL"
            printf 'SUPERUSER_PASSWORD=%q\n'   "$PROD_SU_PASS"
            printf 'GUNICORN_WORKERS=%q\n'     "$PROD_GW"
            printf 'CELERY_CONCURRENCY=%q\n'   "$PROD_CC"
            printf 'EMAIL_HOST_USER=%q\n'      "$PROD_EMAIL_USER"
            printf 'EMAIL_HOST_PASSWORD=%q\n'  "$PROD_EMAIL_PASS"
            printf 'TIMEZONE=Asia/Riyadh\n'
            printf 'PYTHON_VERSION=3.12\n'
            printf 'PG_VERSION=15\n'
          } > "$STAGING/deploy/.env.production"
          chmod 600 "$STAGING/deploy/.env.production"

          sudo bash "$STAGING/deploy/deploy.sh"

          rm -rf "$STAGING"

    # ── FAST DEPLOY ───────────────────────────────────────────────────────────
    # Code is already synced. Install any new deps, migrate, restart.
    - name: Deploy — install deps, migrate, restart
      if: steps.sync.outputs.mode == 'deploy'
      uses: appleboy/ssh-action@v1.0.3
      env:
        APP_DIR: ${{ env.APP_DIR }}
      with:
        host:     ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key:      ${{ secrets.VPS_SSH_KEY }}
        port:     ${{ secrets.VPS_PORT || '22' }}
        envs: APP_DIR
        script: |
          set -euo pipefail

          # rsync ran as root so files may be owned by root.
          # Restore ownership so the app user can read .env and write logs/media.
          # Ensure runtime dirs exist (rsync excludes them; deploy.sh creates them
          # on first bootstrap but they must survive subsequent deploys too).
          sudo mkdir -p "$APP_DIR/run" "$APP_DIR/logs" "$APP_DIR/media" "$APP_DIR/staticfiles"
          sudo chown -R erp:www-data "$APP_DIR"
          sudo chmod 600 "$APP_DIR/.env"
          sudo chmod 770 "$APP_DIR/run"
          sudo chmod 775 "$APP_DIR/media"

          # Run all Django commands as 'erp' — it owns .env (chmod 600)
          # and the venv, so python/pip work correctly.
          PY="$APP_DIR/venv/bin/python"
          PIP="$APP_DIR/venv/bin/pip"

          echo "--- Installing/updating Python dependencies ---"
          sudo -u erp "$PIP" install -r "$APP_DIR/requirements-prod.txt" -q
          sudo -u erp "$PIP" install -r "$APP_DIR/requirements-ml.txt" -q

          echo "--- Running migrations ---"
          sudo -u erp "$PY" "$APP_DIR/manage.py" migrate --noinput

          echo "--- Collecting static files ---"
          sudo -u erp "$PY" "$APP_DIR/manage.py" collectstatic --noinput --clear -v 0

          echo "--- Compiling translations ---"
          sudo -u erp "$PY" "$APP_DIR/manage.py" compilemessages

          echo "--- Restarting services ---"
          for svc in erp-gunicorn erp-celery-worker erp-celery-ml-worker erp-celery-beat; do
            if sudo systemctl list-unit-files "${svc}.service" 2>/dev/null | grep -q "^${svc}"; then
              sudo systemctl restart "$svc" && echo "  Restarted ${svc}"
            else
              echo "  [WARN] ${svc} not found — run bootstrap to install services"
            fi
          done

          echo "--- Health check ---"
          sleep 3
          # Check every service and print a clear status line for each
          for svc in erp-gunicorn erp-celery-worker erp-celery-ml-worker erp-celery-beat nginx postgresql redis-server; do
            if systemctl is-active --quiet "$svc" 2>/dev/null; then
              echo "  [OK]   ${svc} is running"
            else
              echo "  [FAIL] ${svc} is NOT running"
              sudo journalctl -u "$svc" -n 20 --no-pager || true
            fi
          done

          # Verify Gunicorn socket exists
          if [ -S "$APP_DIR/run/gunicorn.sock" ]; then
            echo "  [OK]   gunicorn.sock exists"
          else
            echo "  [FAIL] gunicorn.sock missing — Gunicorn did not start cleanly"
          fi

          # Hit the app locally through Nginx to confirm end-to-end connectivity
          HTTP_CODE=$(curl -sk -o /dev/null -w "%{http_code}" http://localhost/ || echo "000")
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "301" ] || [ "$HTTP_CODE" = "302" ]; then
            echo "  [OK]   HTTP check passed (status ${HTTP_CODE})"
          else
            echo "  [FAIL] HTTP check returned status ${HTTP_CODE}"
            sudo nginx -t || true
          fi

          echo "--- Deploy complete ---"
