name: Django CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: erp_main
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_NAME: erp_main
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      REDIS_URL: redis://localhost:6379/1
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-not-for-production

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libcairo2-dev pkg-config

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install ruff

    - name: Lint with ruff
      run: |
        ruff check .

    - name: Check for missing migrations
      run: |
        python manage.py makemigrations --check --dry-run

    - name: Run Tests
      run: |
        python manage.py test --settings=erpproject.test_settings

  # ── Deploy ──────────────────────────────────────────────────────────────────
  # Runs only on pushes to main/master (not on PRs).
  #
  # Required repository secrets (Settings → Secrets → Actions):
  #   VPS_HOST        — server IP or hostname
  #   VPS_USER        — SSH user (root, or a user with passwordless sudo for systemctl)
  #   VPS_SSH_KEY     — private SSH key (the matching public key must be in
  #                     ~/.ssh/authorized_keys on the VPS)
  #
  # Optional secrets (defaults shown):
  #   VPS_PORT        — SSH port          (default: 22)
  #   VPS_APP_DIR     — app directory     (default: /opt/erpdjango)
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    env:
      VPS_HOST:    ${{ secrets.VPS_HOST }}
      VPS_USER:    ${{ secrets.VPS_USER }}
      VPS_PORT:    ${{ secrets.VPS_PORT    || '22' }}
      APP_DIR:     ${{ secrets.VPS_APP_DIR || '/opt/erpdjango' }}

    steps:
    - uses: actions/checkout@v4

    # Set up SSH agent so rsync can authenticate without a password prompt
    - name: Set up SSH agent
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

    - name: Add VPS to known hosts
      run: ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

    # Push only changed source files — skips venv, media, .env so they are
    # never accidentally overwritten by CI.
    - name: Sync code to VPS
      run: |
        rsync -az --delete \
          --exclude='.git/' \
          --exclude='venv/' \
          --exclude='__pycache__/' \
          --exclude='*.pyc' \
          --exclude='.env' \
          --exclude='media/' \
          --exclude='staticfiles/' \
          --exclude='logs/' \
          -e "ssh -p $VPS_PORT" \
          ./ "$VPS_USER@$VPS_HOST:$APP_DIR/"

    # Install any new/updated packages, run migrations, collect statics,
    # then perform a zero-downtime restart of all three services.
    - name: Run post-deploy steps on VPS
      uses: appleboy/ssh-action@v1.0.3
      env:
        APP_DIR: ${{ env.APP_DIR }}
      with:
        host:     ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key:      ${{ secrets.VPS_SSH_KEY }}
        port:     ${{ secrets.VPS_PORT || '22' }}
        envs:     APP_DIR
        script: |
          set -euo pipefail
          source "$APP_DIR/venv/bin/activate"
          cd "$APP_DIR"

          echo "--- Installing/updating Python dependencies ---"
          pip install -r requirements.txt -q

          echo "--- Running migrations ---"
          python manage.py migrate --noinput

          echo "--- Collecting static files ---"
          python manage.py collectstatic --noinput --clear -v 0

          echo "--- Compiling translations ---"
          python manage.py compilemessages

          echo "--- Restarting services ---"
          systemctl restart erp-gunicorn erp-celery-worker erp-celery-beat

          echo "--- Deploy complete ---"
