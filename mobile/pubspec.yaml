name: erp_mobile
description: "ERP Employee Portal Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  provider: ^6.1.0
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.0
  mobile_scanner: ^5.0.0
  pull_to_refresh_flutter3: ^2.0.2
  shimmer: ^3.0.0
  cached_network_image: ^3.3.0
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/logo.png
  remove_alpha_ios: true
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: assets/branding/logo.png

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/logo.svg
    - assets/branding/logo.png
