{% extends "erp/form_base.html" %}
{% load i18n %}

{% block cancel_url %}{% url 'erp:service_category_list' %}{% endblock %}

{% block form_content %}
    <div class="form-section">
        <h6 class="form-section-title">{% trans "Category Information" %}</h6>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="{{ form.name.id_for_label }}" class="form-label">{% trans "Name (English)" %}</label>
                {{ form.name }}
            </div>
            <div class="col-md-6 mb-3">
                <label for="{{ form.name_ar.id_for_label }}" class="form-label">{% trans "Name (Arabic)" %}</label>
                {{ form.name_ar }}
            </div>
        </div>
        <div class="row">
            <div class="col-md-9 mb-3">
                <label for="{{ form.description.id_for_label }}" class="form-label">{% trans "Description" %}</label>
                {{ form.description }}
            </div>
            <div class="col-md-3 mb-3">
                <div class="form-check mt-4">
                    {{ form.is_active }}
                    <label class="form-check-label" for="{{ form.is_active.id_for_label }}">{% trans "Active" %}</label>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
