{% extends 'erp/base.html' %}

{% block title %}تأكيد الحذف - نظام ERP{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-5">
            <div class="card border-danger">
                <div class="card-header bg-danger text-white">
                    <h5 class="mb-0">
                        <i class="bi bi-exclamation-triangle me-2"></i>
                        تأكيد الحذف
                    </h5>
                </div>
                <div class="card-body text-center py-4">
                    <div class="mb-4">
                        <i class="bi bi-trash text-danger" style="font-size: 3rem;"></i>
                    </div>
                    <h5 class="mb-3">حذف {{ object_type }}؟</h5>
                    <p class="text-muted mb-4">
                        هل أنت متأكد من حذف <strong>"{{ object }}"</strong>؟
                        <br>
                        <span class="text-danger">لا يمكن التراجع عن هذا الإجراء.</span>
                    </p>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex gap-3 justify-content-center">
                            <a href="{{ cancel_url }}" class="btn btn-outline-secondary">
                                <i class="bi bi-x-lg me-1"></i> إلغاء
                            </a>
                            <button type="submit" class="btn btn-danger">
                                <i class="bi bi-trash me-1"></i> نعم، احذف
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
